<title>Deutschlernwerkstatt</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;color:#2b2d42;
  font-family:ui-rounded,"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;font-size:18px;
  background:radial-gradient(circle at 8% 0%,#ffe4ef 0,transparent 38%),radial-gradient(circle at 100% 8%,#e1efff 0,transparent 38%),#fff6e5}
.box{background:#fff;border-radius:24px;padding:26px 22px;width:100%;max-width:400px;text-align:center;
  box-shadow:0 4px 0 rgba(43,45,66,.06),0 10px 28px rgba(43,45,66,.12)}
.lock{font-size:3.4rem;line-height:1}
h1{font-size:1.5rem;margin:.3em 0 .2em}
p{margin:.3em 0 1em;color:#666b82}
input[type=password]{font:inherit;font-size:1.3rem;width:100%;padding:12px 14px;border:2px solid #dcdcec;border-radius:14px;text-align:center}
input[type=password]:focus{outline:none;border-color:#5b5bd6;background:#f3f3ff}
label{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0;font-size:.95rem;color:#2b2d42;cursor:pointer}
label input{width:22px;height:22px}
button{font:inherit;font-weight:800;font-size:1.15rem;width:100%;border:0;border-radius:14px;padding:13px 20px;cursor:pointer;
  background:#5b5bd6;color:#fff;box-shadow:0 4px 0 #3f3fa8}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #3f3fa8}
button:disabled{opacity:.6}
.err{color:#d03a3a;font-weight:800;min-height:1.4em;margin-top:12px}
.hidden{display:none}
</style>
</head>

    <button id="btn" type="submit">Öffnen 🔓</button>
    <div class="err" id="err" role="alert"></div>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Deutsch-Werkstatt</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;color:#2b2d42;
  font-family:ui-rounded,"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;font-size:18px;
  background:radial-gradient(circle at 8% 0%,#ffe4ef 0,transparent 38%),radial-gradient(circle at 100% 8%,#e1efff 0,transparent 38%),#fff6e5}
.box{background:#fff;border-radius:24px;padding:26px 22px;width:100%;max-width:400px;text-align:center;
  box-shadow:0 4px 0 rgba(43,45,66,.06),0 10px 28px rgba(43,45,66,.12)}
.lock{font-size:3.4rem;line-height:1}
h1{font-size:1.5rem;margin:.3em 0 .2em}
p{margin:.3em 0 1em;color:#666b82}
input[type=password]{font:inherit;font-size:1.3rem;width:100%;padding:12px 14px;border:2px solid #dcdcec;border-radius:14px;text-align:center}
input[type=password]:focus{outline:none;border-color:#5b5bd6;background:#f3f3ff}
label{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0;font-size:.95rem;color:#2b2d42;cursor:pointer}
label input{width:22px;height:22px}
button{font:inherit;font-weight:800;font-size:1.15rem;width:100%;border:0;border-radius:14px;padding:13px 20px;cursor:pointer;
  background:#5b5bd6;color:#fff;box-shadow:0 4px 0 #3f3fa8}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #3f3fa8}
button:disabled{opacity:.6}
.err{color:#d03a3a;font-weight:800;min-height:1.4em;margin-top:12px}
.hidden{display:none}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="lock">🔒</div>
  <h1>Deutsch-Werkstatt</h1>

    <button id="btn" type="submit">Öffnen 🔓</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

  var KEY="lernwerkstatt-schluessel";
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}
  function unhex(h){var u=new Uint8Array(h.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return u;}
  function store(){try{return window.localStorage;}catch(e){return null;}}
  var box=document.getElementById('box');
  if(!window.crypto||!crypto.subtle){document.getElementById('err').textContent='Dieser Browser ist zu alt. Bitte öffne die Seite in Safari oder Chrome.';return;}
  function derive(pw){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
      return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(DATA.salt),iterations:DATA.iter},k,256);

  function open(raw){
    return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){

  document.getElementById('f').addEventListener('submit',function(e){

    var pw=document.getElementById('pw').value.trim(),btn=document.getElementById('btn'),err=document.getElementById('err');
